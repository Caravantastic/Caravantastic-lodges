<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravantastic | Dates & guests</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand-text" href="index.html">Caravantastic</a><span class="step">Step 2 of 5</span></div></header><main><div class="wrap"><div class="eyebrow">Your stay</div><h1>Dates & guests</h1><p class="sub" id="prop"></p><div class="panel"><div class="row"><div class="field"><label>Check-in date</label><input id="ci" type="date"></div><div class="field"><label>Check-out date</label><input id="co" type="date"></div></div><div class="field"><label>Guests</label><input id="guests" type="number" min="1" value="2"></div><div class="notice"><strong>Check-in:</strong> 1:00 PM &nbsp;·&nbsp; <strong>Check-out:</strong> 11:00 AM<br>Dates are selected as a booking request. No availability is marked or blocked.</div><div id="estimate" class="muted"></div></div><div class="actions"><a class="btn secondary" href="index.html">Back</a><button class="right" onclick="next()">Continue</button></div></div></main><footer>Caravantastic</footer><script src="common.js"></script><script>const d=cabin();prop.textContent=d.property+' · '+d.location+' · '+money(d.price)+' per night';function calc(){if(!ci.value||!co.value){estimate.textContent='';return}const n=Math.round((new Date(co.value+'T00:00:00')-new Date(ci.value+'T00:00:00'))/86400000);estimate.textContent=n>0?n+' night'+(n==1?'':'s')+' · Estimated total '+money(n*d.price):'Please choose a check-out date after check-in.'}ci.onchange=calc;co.onchange=calc;function next(){const n=Math.round((new Date(co.value+'T00:00:00')-new Date(ci.value+'T00:00:00'))/86400000);if(!ci.value||!co.value||n<=0||Number(guests.value)<1){alert('Please enter valid dates and number of guests.');return}save({...d,checkin:ci.value,checkout:co.value,guests:Number(guests.value),nights:n,total:n*d.price});location.href='details.html'}</script></body></html>
