<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravantastic | Dates & guests</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand-text" href="index.html">Caravantastic</a><span class="step">Step 2 of 5</span></div></header><main><div class="wrap"><div class="eyebrow">Your stay</div><h1>Dates & guests</h1><p class="sub" id="prop"></p><div class="panel"><div class="row"><div class="field"><label>Check-in date</label><input id="ci" type="date"></div><div class="field"><label>Check-out date</label><input id="co" type="date"></div></div><div class="field"><label>Guests</label><input id="guests" type="number" min="1" value="2"></div><div class="notice"><strong>Check-in:</strong> 1:00 PM &nbsp;·&nbsp; <strong>Check-out:</strong> 11:00 AM<br>Dates are selected as a booking request. No availability is marked or blocked.</div><div id="estimate" class="muted"></div></div><div class="actions"><a class="btn secondary" href="index.html">Back</a><button class="right" onclick="next()">Continue</button></div></div></main><footer>Caravantastic</footer><script src="common.js?v=price-fix-20260919"></script><script>
const d=cabin();
const ciEl=document.getElementById('ci'),coEl=document.getElementById('co'),guestsEl=document.getElementById('guests');
const propEl=document.getElementById('prop'),estimateEl=document.getElementById('estimate');
const resolvedRate=canonicalRate(d.property);
if(resolvedRate!==null)d.price=resolvedRate;
const nightlyRate=Number(d.price);
if(Number.isFinite(nightlyRate)&&nightlyRate>0){propEl.textContent=d.property+' · '+d.location+' · '+money(nightlyRate)+' per night';save({...d,price:nightlyRate});}
else{propEl.textContent=d.property+' · '+d.location+' · Price needs confirmation';estimateEl.textContent='We’re unable to calculate this cabin’s price right now. Please go back and select the cabin again, or contact Caravantastic before continuing.';}
function calc(){
 if(!ciEl.value||!coEl.value){estimateEl.textContent='';return}
 const n=nightsBetween(ciEl.value,coEl.value);
 if(n>0&&Number.isFinite(nightlyRate)&&nightlyRate>0)estimateEl.textContent=n+' night'+(n===1?'':'s')+' · Estimated total '+money(n*nightlyRate);
 else estimateEl.textContent='Please choose a check-out date after check-in.';
}
ciEl.addEventListener('change',calc);coEl.addEventListener('change',calc);
function next(){
 const n=nightsBetween(ciEl.value,coEl.value),guests=Number(guestsEl.value);
 if(!Number.isFinite(nightlyRate)||nightlyRate<=0){alert('We could not verify this cabin’s nightly rate. Please go back and select the cabin again.');return}
 if(!ciEl.value||!coEl.value||n<=0||!Number.isFinite(guests)||guests<1){alert('Please enter valid dates and number of guests.');return}
 save({...d,price:nightlyRate,checkin:ciEl.value,checkout:coEl.value,guests,nights:n,total:n*nightlyRate});
 location.href='details.html';
}
</script></body></html>
