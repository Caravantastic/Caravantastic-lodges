<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravantastic | Guest details</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand-text" href="index.html">Caravantastic</a><span class="step">Step 3 of 5</span></div></header><main><div class="wrap"><div class="eyebrow">Guest information</div><h1>Your details</h1><p class="sub">Enter the details we should use for your booking request.</p><div class="panel"><div class="field"><label>Full name</label><input id="name"></div><div class="row"><div class="field"><label>Email address</label><input id="email" type="email"></div><div class="field"><label>Phone number</label><input id="phone" type="tel"></div></div><div class="field"><label>Special requests <span class="muted">(optional)</span></label><textarea id="special"></textarea></div></div><div class="actions"><a class="btn secondary" href="dates.html">Back</a><button class="right" onclick="next()">Continue</button></div></div></main><footer>Caravantastic</footer><script src="common.js"></script><script>const d=cabin();const old=data();const nameEl=document.getElementById('name');const emailEl=document.getElementById('email');const phoneEl=document.getElementById('phone');const specialEl=document.getElementById('special');nameEl.value=old.name||'';emailEl.value=old.email||'';phoneEl.value=old.phone||'';specialEl.value=old.special||'';function next(){const name=nameEl.value.trim();const email=emailEl.value.trim();const phone=phoneEl.value.trim();const special=specialEl.value.trim();if(!name||!email||!phone){alert('Please complete your name, email and phone number.');return}save({...d,name,email,phone,special});location.href='review.html'}</script></body></html>
